# 아이폰 앱 빌드·App Store Connect 업로드 — 맥 없이(GitHub 맥 러너)
# 비밀값(저장소 Settings → Secrets → Actions): ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8(.p8 파일 내용 그대로)
# 손으로 돌린다: Actions → ios → Run workflow → 앱(golf·owner·museum·saydo·all) · 빌드 번호
name: ios
on:
  workflow_dispatch:
    inputs:
      app: { description: '앱 (golf · owner · museum · saydo · all)', required: true, default: 'all' }
      build: { description: '빌드 번호(올릴 때마다 +1)', required: true, default: '1' }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { apps: '${{ steps.p.outputs.apps }}' }
    steps:
      - id: p
        run: |
          if [ "${{ inputs.app }}" = all ]; then echo 'apps=["golf","owner","museum","saydo"]' >> "$GITHUB_OUTPUT"; else echo "apps=[\"${{ inputs.app }}\"]" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: plan
    runs-on: macos-15
    strategy: { fail-fast: false, max-parallel: 1, matrix: { app: '${{ fromJson(needs.plan.outputs.apps) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: 앱 틀 다시 맞추기
        run: node make.js ${{ matrix.app }}
      - name: API 키
        env: { P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: 아카이브(자동 서명)
        working-directory: apps/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" CURRENT_PROJECT_VERSION=${{ inputs.build }} \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} archive
      - name: App Store Connect 로 올리기
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string>
          <key>teamID</key><string>8G66DP2U52</string><key>signingStyle</key><string>automatic</string><key>manageAppVersionAndBuildNumber</key><false/></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - if: always()
        run: rm -rf ~/.appstoreconnect
